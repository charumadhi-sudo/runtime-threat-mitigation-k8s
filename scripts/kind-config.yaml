# Kind Cluster Configuration for Runtime Threat Mitigation Pipeline
# Configured for Falco eBPF syscall inspection & multi-node workload isolation
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: rtm-k8s-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.31.0
    extraMounts:
      # Mount tracefs / debugfs for Falco eBPF probe access
      - hostPath: /sys/kernel/debug
        containerPath: /sys/kernel/debug
      - hostPath: /etc/os-release
        containerPath: /etc/os-release
        readOnly: true
